version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ledger_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ledger_db}
      POSTGRES_USER: ${DB_USER:-ledger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-change-me}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
      DB_NAME: ${DB_NAME:-ledger_db}
      DB_USER: ${DB_USER:-ledger_user}
      DB_PASSWORD: ${DB_PASSWORD:-ledger_pass}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
