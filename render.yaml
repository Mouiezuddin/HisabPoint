services:
  - type: web
    name: hisabpoint-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: hisabpoint.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hisab-point.vercel.app
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard — paste your NeonDB connection string
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12"

