type: service
name: hisabpoint-api

build:
  type: docker
  dockerfile: Dockerfile

routes:
  - path: /
    port: 8000

ports:
  - port: 8000
    protocol: http

env:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
  - key: PORT
    value: "8000"

health_checks:
  - http:
      path: /api/health/
      port: 8000
    initial_delay: 10
    interval: 30
    timeout: 5
