<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c13"/>
      <stop offset="50%" stop-color="#0f2b1d"/>
      <stop offset="100%" stop-color="#06160f"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.8"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#shadow)">
    <path d="M120 150 C 180 140, 240 160, 256 175 C 272 160, 332 140, 392 150 L 392 370 C 332 360, 272 380, 256 395 C 240 380, 180 360, 120 370 Z" 
          fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

    <path d="M130 160 C 185 152, 235 170, 250 182 L 250 382 C 235 370, 185 352, 130 360 Z" 
          fill="url(#paperGrad)" stroke="#b45309" stroke-width="1.5"/>

    <path d="M262 182 C 277 170, 327 152, 382 160 L 382 360 C 327 352, 277 370, 262 382 Z" 
          fill="url(#paperGrad)" stroke="#b45309" stroke-width="1.5"/>

    <line x1="150" y1="210" x2="230" y2="218" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="150" y1="245" x2="230" y2="253" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="150" y1="280" x2="230" y2="288" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="150" y1="315" x2="230" y2="323" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>

    <line x1="282" y1="218" x2="362" y2="210" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="282" y1="253" x2="362" y2="245" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="282" y1="288" x2="362" y2="280" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>
    <line x1="282" y1="323" x2="362" y2="315" stroke="#ca8a04" stroke-width="2.5" opacity="0.6"/>

    <path d="M 246 140 L 266 140 L 266 230 L 256 215 L 246 230 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1"/>

    <circle cx="256" cy="285" r="54" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="256" cy="285" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="256" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">₹</text>
    <circle cx="256" cy="140" r="10" fill="url(#goldGrad)"/>
  </g>

  <rect x="186" y="420" width="140" height="34" rx="8" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="256" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#081c13" text-anchor="middle" letter-spacing="3">खाता</text>
</svg>
